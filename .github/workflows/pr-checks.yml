name: PR Checks

on:
  pull_request:
    branches: [ main, master ]
    types: [opened, synchronize, reopened]

jobs:
  pr-validation:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20.x'
        cache: 'npm'

    - name: Install dependencies
      run: npm ci --legacy-peer-deps

    - name: Run tests with coverage
      run: npm run test:coverage || npm test -- --run
      continue-on-error: true

    - name: Build site
      run: npm run build
      env:
        NODE_ENV: production

    - name: Check build size
      run: |
        BUILD_SIZE=$(du -sh public | cut -f1)
        echo "Build size: $BUILD_SIZE"
        echo "### Build Summary :rocket:" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "- **Build Size**: $BUILD_SIZE" >> $GITHUB_STEP_SUMMARY
        echo "- **Node Version**: $(node --version)" >> $GITHUB_STEP_SUMMARY
        echo "- **NPM Version**: $(npm --version)" >> $GITHUB_STEP_SUMMARY

    - name: Comment on PR
      uses: actions/github-script@v7
      if: github.event_name == 'pull_request'
      with:
        script: |
          const fs = require('fs');
          const buildSize = require('child_process')
            .execSync('du -sh public')
            .toString()
            .split('\t')[0];

          github.rest.issues.createComment({
            issue_number: context.issue.number,
            owner: context.repo.owner,
            repo: context.repo.repo,
            body: `## ✅ Build Successful\n\n**Build Size:** ${buildSize}\n\nAll checks passed! 🎉`
          });
